<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000342}
body{border:3.69vmin solid #000342}
canvas{display:block;width:100%;height:100%;touch-action:none;background:#000342}
#ui{position:fixed;bottom:4vmin;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
  background:#ffffff22;border:1px solid #fff;backdrop-filter:blur(6px);padding:6px 10px;border-radius:24px;font:14px sans-serif;color:#fff}
button{background:#fff2;border:1px solid #fff;color:#fff;padding:6px;border-radius:50%;cursor:pointer;display:flex}
button.on{background:#fff;color:#000342}
button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
input[type=range]{width:70px}
#cursor{position:fixed;cursor:grab;border:2px solid #fff;display:none;transform:translate(-50%,-50%);z-index:3}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="cursor"></div>
<div id="ui">
  <button id="penBtn" class="on"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  <input id="penSize" type="range" min="1" max="50" value="4">
  <button id="eraserBtn"><svg viewBox="0 0 24 24"><path d="M20 20H8l-5-5a2 2 0 0 1 0-2.8L13 3l8 8-7 7"/></svg></button>
  <input id="eraserSize" type="range" min="5" max="100" value="25">
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const resize=()=>{c.width=c.clientWidth;c.height=c.clientHeight};
resize();addEventListener('resize',resize);
ctx.lineCap=ctx.lineJoin='round';

let mode='pen',drawing=false,erasing=false;
const penBtn=document.getElementById('penBtn'),eraserBtn=document.getElementById('eraserBtn');
const penSize=document.getElementById('penSize'),eraserSize=document.getElementById('eraserSize');
const cursor=document.getElementById('cursor');
const placeBox=(x,y)=>{cursor.style.left=x+'px';cursor.style.top=y+'px'};
placeBox(innerWidth/2,innerHeight/2);
const setMode=m=>{mode=m;penBtn.classList.toggle('on',m==='pen');eraserBtn.classList.toggle('on',m==='eraser');cursor.style.display=m==='eraser'?'block':'none'};
penBtn.onclick=()=>setMode('pen');
eraserBtn.onclick=()=>setMode('eraser');
eraserSize.oninput=()=>{cursor.style.width=cursor.style.height=eraserSize.value+'px'};
eraserSize.oninput();

const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};

c.onpointerdown=e=>{if(mode!=='pen')return;drawing=true;ctx.beginPath();ctx.moveTo(...pos(e))};
c.onpointermove=e=>{
  if(mode!=='pen'||!drawing)return;
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='#fff';
  ctx.lineWidth=penSize.value;
  ctx.lineTo(...pos(e));ctx.stroke();
};

cursor.onpointerdown=e=>{erasing=true;cursor.setPointerCapture(e.pointerId);cursor.style.cursor='grabbing';ctx.beginPath();ctx.moveTo(...pos(e))};
cursor.onpointermove=e=>{
  if(!erasing)return;
  placeBox(e.clientX,e.clientY);
  ctx.globalCompositeOperation='destination-out';
  ctx.lineWidth=eraserSize.value;
  ctx.lineTo(...pos(e));ctx.stroke();
};
cursor.onpointerup=()=>{erasing=false;cursor.style.cursor='grab'};

addEventListener('pointerup',()=>drawing=false);
</script>
</body></html>
